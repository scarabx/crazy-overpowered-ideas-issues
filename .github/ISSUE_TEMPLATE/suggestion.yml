name: Suggestion
description: An idea for COPI.
labels: ["suggestion"]
body:
  - type: dropdown
    id: version
    attributes:
      label: Which version of COPI?
      description: The Minecraft version and mod loader you play COPI on. It is in the jar's file name.
      options:
        - Fabric 1.20.1
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What it is and how you imagine it working in game.
    validations:
      required: true
